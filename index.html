  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #wrap {
      position: fixed;
      inset: 50px;
      background: #000;
    }

    #cv {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;


      image-rendering: auto;
    }

    @media (max-width: 600px) {
      #wrap {
        inset: 20px;
      }
    }
  </style>
</head>

<body>

  <div id="wrap">
    <canvas id="cv"></canvas>
  </div>


  <script>
    (() => {

      // ==================================================
      // CANVAS
      // ==================================================

      const cv =
        document.getElementById('cv');

      const ctx =
        cv.getContext('2d', {
          alpha: false
        });


      // ==================================================
      // GRID
      // ==================================================

      const COLS = 9;
      const ROWS = 9;



      const DESKTOP_SPACING = 56;
      const MOBILE_SPACING = 38;



      const BASE_R = 3.2;



      const MAX_R = 15;



      const POINTER_RADIUS = 115;


      // ==================================================
      // PHYSICS
      // ==================================================

      const SPRING_K = 0.09;

      const DAMP = 0.78;



      const GRAVITY_R = 145;

      const GRAVITY_MAX = 17;


      // ==================================================
      // WAVE
      // ==================================================

      const ROW_DELAY = 0.055;

      const BOUNCE_AMP = 10;

      const DECAY = 4.2;

      const FREQ = 13.0;

      const COL_SPREAD = 0.65;


      // ==================================================
      // STATE
      // ==================================================

      let W = 0;
      let H = 0;

      let DPR = 1;

      let SPACING =
        DESKTOP_SPACING;

      let dots = [];

      let t = 0;

      let lastTime =
        performance.now();

      let drops = [];

      let nextDropAt = 0.6;


      const pointer = {
        x: -9999,
        y: -9999,
        active: false
      };


      // ==================================================
      // RESIZE
      // ==================================================

      function resize() {

        const rect =
          cv.getBoundingClientRect();


        W = rect.width;
        H = rect.height;



        DPR =
          Math.min(
            window.devicePixelRatio || 1,
            3
          );


        cv.width =
          Math.round(W * DPR);

        cv.height =
          Math.round(H * DPR);



        ctx.setTransform(
          DPR,
          0,
          0,
          DPR,
          0,
          0
        );



        SPACING =
          W <= 600
            ? MOBILE_SPACING
            : DESKTOP_SPACING;


        buildGrid();
      }


      // ==================================================
      // GRID
      // ==================================================

      function buildGrid() {

        const ox =
          (W -
            (COLS - 1) * SPACING) / 2;


        const oy =
          (H -
            (ROWS - 1) * SPACING) / 2;


        dots = [];


        for (
          let row = 0;
          row < ROWS;
          row++
        ) {

          for (
            let col = 0;
            col < COLS;
            col++
          ) {

            const bx =
              ox +
              col * SPACING;


            const by =
              oy +
              row * SPACING;


            dots.push({

              bx,
              by,

              x: bx,
              y: by,

              vx: 0,
              vy: 0,


              r: BASE_R,

              col,
              row

            });
          }
        }
      }


      // ==================================================
      // WAVE
      // ==================================================

      function spawnDrop() {

        drops.push({

          col:
            Math.floor(
              Math.random() * COLS
            ),

          time: t,

          amp:
            BOUNCE_AMP *
            (
              0.7 +
              Math.random() * 0.55
            )

        });


        nextDropAt =
          t +
          1.8 +
          Math.random() * 2.4;
      }


      // ==================================================
      // UPDATE
      // ==================================================

      function update(delta) {

        const dt =
          Math.min(delta, 32) /
          16.6667;


        t +=
          0.016 * dt;


        // ----------------------------------------------
        // Automatische Welle
        // ----------------------------------------------

        if (t >= nextDropAt) {
          spawnDrop();
        }


        drops =
          drops.filter(
            drop =>
              (t - drop.time) < 2.5
          );


        // ----------------------------------------------
        // Punkte
        // ----------------------------------------------

        for (const dot of dots) {

          let tx = dot.bx;
          let ty = dot.by;



          let targetRadius =
            BASE_R;


          // ============================================
          // WAVE
          // ============================================

          for (const drop of drops) {

            const localT =
              (t - drop.time) -
              dot.row * ROW_DELAY;


            if (localT <= 0) {
              continue;
            }


            const colDist =
              Math.abs(
                dot.col -
                drop.col
              );


            const lateral =
              Math.exp(
                -(colDist ** 2) *
                COL_SPREAD
              );


            if (lateral < 0.01) {
              continue;
            }


            ty +=
              drop.amp *
              Math.exp(
                -DECAY *
                localT
              ) *
              Math.sin(
                FREQ *
                localT
              ) *
              lateral;
          }


          // ============================================
          // POINTER
          // ============================================

          if (pointer.active) {

            const dx =
              pointer.x -
              dot.bx;


            const dy =
              pointer.y -
              dot.by;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              POINTER_RADIUS
            ) {



              const influence =
                Math.max(
                  0,
                  1 -
                  distance /
                  POINTER_RADIUS
                );



              const strength =
                influence *
                influence *
                influence;



              targetRadius =
                BASE_R +
                (
                  MAX_R -
                  BASE_R
                ) *
                strength;




              if (distance > 0.001) {

                const movement =
                  strength *
                  GRAVITY_MAX;


                tx +=
                  (
                    dx /
                    distance
                  ) *
                  movement;


                ty +=
                  (
                    dy /
                    distance
                  ) *
                  movement;
              }
            }
          }


          // ============================================
          // SPRING
          // ============================================

          dot.vx +=
            (
              tx -
              dot.x
            ) *
            SPRING_K *
            dt;


          dot.vy +=
            (
              ty -
              dot.y
            ) *
            SPRING_K *
            dt;


          dot.vx *=
            Math.pow(
              DAMP,
              dt
            );


          dot.vy *=
            Math.pow(
              DAMP,
              dt
            );


          dot.x +=
            dot.vx *
            dt;


          dot.y +=
            dot.vy *
            dt;


          // ============================================
          // RADIUS SMOOTHING
          // ============================================

          dot.r +=
            (
              targetRadius -
              dot.r
            ) *
            0.16 *
            dt;
        }
      }


      // ==================================================
      // DRAW
      // ==================================================

      function draw() {



        ctx.fillStyle =
          '#000';


        ctx.fillRect(
          0,
          0,
          W,
          H
        );




        ctx.fillStyle =
          '#fff';


        for (const dot of dots) {

          ctx.beginPath();


          ctx.arc(
            dot.x,
            dot.y,
            dot.r,
            0,
            Math.PI * 2
          );


          ctx.fill();
        }
      }


      // ==================================================
      // POINTER
      // ==================================================

      function setPointer(
        clientX,
        clientY
      ) {

        const rect =
          cv.getBoundingClientRect();


        pointer.x =
          clientX -
          rect.left;


        pointer.y =
          clientY -
          rect.top;


        pointer.active =
          true;
      }


      // ==================================================
      // MOUSE
      // ==================================================

      window.addEventListener(
        'mousemove',
        event => {

          setPointer(
            event.clientX,
            event.clientY
          );

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'mouseleave',
        () => {

          pointer.active =
            false;

        }
      );


      // ==================================================
      // TOUCH
      // ==================================================

      window.addEventListener(
        'touchstart',
        event => {

          if (
            event.touches.length
          ) {

            setPointer(
              event.touches[0].clientX,
              event.touches[0].clientY
            );

          }

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'touchmove',
        event => {

          if (
            event.touches.length
          ) {

            setPointer(
              event.touches[0].clientX,
              event.touches[0].clientY
            );

          }

        },
        {
          passive: true
        }
      );


      window.addEventListener(
        'touchend',
        () => {

          pointer.active =
            false;

        },
        {
          passive: true
        }
      );


      // ==================================================
      // RESIZE
      // ==================================================

      window.addEventListener(
        'resize',
        resize
      );


      window.addEventListener(
        'orientationchange',
        () => {

          setTimeout(
            resize,
            100
          );

        }
      );


      // ==================================================
      // INITIALISIERUNG
      // ==================================================

      resize();


      // ==================================================
      // ANIMATION
      // ==================================================

      function animate(now) {

        const delta =
          now -
          lastTime;


        lastTime =
          now;


        update(delta);

        draw();


        requestAnimationFrame(
          animate
        );
      }


      requestAnimationFrame(
        animate
      );

    })();
  </script>

</body>
</html>
